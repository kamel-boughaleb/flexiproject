<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Mobile — Connexion</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&amp;family=Rock+Salt&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:"Quicksand",sans-serif;color:#121212}
a{color:#215D7D}a:hover{color:#214258}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; background: #FFFFFF; font-family: 'Quicksand', sans-serif; color: #121212">

  <!-- Brand header -->
  <div style="position: relative; overflow: hidden; background: #FEE5F2; border-radius: 0 0 32px 32px; padding: 28px 24px 30px; display: flex; flex-direction: column; gap: 18px">
    <div aria-hidden="true" style="position: absolute; right: -70px; top: -70px; width: 200px; height: 200px; border-radius: 100px 100px 100px 160px; background: #FFCAE6"></div>
    <div style="display: flex; align-items: center; gap: 10px; position: relative">
      <div style="width: 40px; height: 40px; border-radius: 12px; background: #FF489C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 20px; box-shadow: 6px 10px 10px 0 #112a3b33">F</div>
      <div style="display: flex; flex-direction: column"><span style="font-weight: 700; font-size: 16px">Flexi Projets</span><span style="font-size: 12px; color: #575757">Flexilivre</span></div>
    </div>
    <div style="position: relative; display: flex; flex-direction: column; gap: 6px">
      <span style="font-family: 'Rock Salt', cursive; font-size: 14px; line-height: 22px; color: #D10553">Vos projets, bien rangés</span>
      <h1 style="margin: 0; font-size: 26px; line-height: 1.3; font-weight: 700">Bon retour parmi nous</h1>
    </div>
  </div>

  <form style="flex: 1; padding: 24px 20px 28px; display: flex; flex-direction: column; gap: 16px">
    <button type="button" style="height: 52px; border: 2px solid #DCDDE0; background: #FFFFFF; border-radius: 100px; font-size: 16px; font-weight: 700; color: #121212; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer"><span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 100px; border: 2px solid #DCDDE0; box-sizing: border-box; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; color: #575757">G</span>Continuer avec Google</button>

    <div style="display: flex; align-items: center; gap: 12px; font-size: 11px; font-weight: 700; color: #575757; letter-spacing: 0.04em"><span style="flex: 1; height: 1px; background: #ECEDEF"></span>OU AVEC VOTRE E-MAIL<span style="flex: 1; height: 1px; background: #ECEDEF"></span></div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="m-email" style="font-size: 14px; font-weight: 700">Adresse e-mail</label>
      <input id="m-email" type="email" autocomplete="email" value="kb@flexilivre.com" style="height: 52px; padding: 0 16px; border: 2px solid #DCDDE0; border-radius: 14px; font-size: 16px; color: #121212; box-sizing: border-box">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="m-pass" style="font-size: 14px; font-weight: 700">Mot de passe</label>
      <div style="height: 52px; display: flex; align-items: center; padding: 0 4px 0 16px; border: 2px solid #DCDDE0; border-radius: 14px; box-sizing: border-box">
        <input id="m-pass" type="{{ passType }}" autocomplete="current-password" value="motdepasse" style="flex: 1; min-width: 0; border: none; outline: none; font-size: 16px; color: #121212; background: transparent">
        <button type="button" onClick="{{ togglePass }}" aria-label="{{ passLabel }}" aria-pressed="{{ passPressed }}" style="width: 44px; height: 44px; border: none; background: none; border-radius: 100px; color: #575757; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12S6 6 12 6s9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between">
      <label style="display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; min-height: 44px"><input type="checkbox" style="width: 20px; height: 20px; accent-color: #D10553; margin: 0">Se souvenir de moi</label>
      <a href="#" style="font-size: 14px; font-weight: 700; color: #215D7D; min-height: 44px; display: flex; align-items: center">Mot de passe oublié ?</a>
    </div>

    <a href="M-Kanban.dc.html" style="height: 52px; border-radius: 100px; background: #FF489C; color: #FFFFFF; font-size: 18px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 4px 0 #112a3b1a">Se connecter</a>

    <p style="margin: auto 0 0; text-align: center; font-size: 13px; line-height: 20px; color: #575757">Pas encore de compte ? L'accès se fait sur invitation d'un administrateur.</p>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { showPass: false };
  }
  renderVals() {
    const show = this.state.showPass;
    return {
      passType: show ? 'text' : 'password',
      passLabel: show ? 'Masquer le mot de passe' : 'Afficher le mot de passe',
      passPressed: show ? 'true' : 'false',
      togglePass: () => this.setState({ showPass: !show })
    };
  }
}
</script>
</body>
</html>
