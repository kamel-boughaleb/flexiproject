<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Test projet — Planning</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F7F9;font-family:"Quicksand",sans-serif;color:#121212}
a{color:#215D7D}a:hover{color:#214258}
button{font-family:inherit}
.hov:hover{background:#F1F2F4}
.bar:hover{box-shadow:0 4px 10px 0 #112a3b33}
</style>
</helmet>
<div style="display: flex; flex-wrap: wrap; min-height: 960px; background: #F6F7F9; font-family: 'Quicksand', sans-serif; color: #121212">
  <div style="flex: 1 1 232px; max-width: 100%"><dc-import name="Sidebar" hint-size="100%,960px"></dc-import></div>
  <main style="flex: 999 1 560px; min-width: 0; margin: 10px 10px 10px 0; background: #FFFFFF; border-radius: 20px; box-shadow: 0 2px 4px 0 #112a3b1a; display: flex; flex-direction: column; overflow: hidden">
    <dc-import name="ProjectHeader" active="planning" hint-size="100%,118px"></dc-import>

    <div style="display: flex; align-items: center; gap: 10px; padding: 14px 28px; flex-wrap: wrap">
      <button type="button" style="height: 36px; padding: 0 16px; border: 1px solid #DCDDE0; background: #FFFFFF; border-radius: 100px; font-size: 14px; font-weight: 700; color: #343434; cursor: pointer">Aujourd'hui</button>
      <h2 style="margin: 0; font-size: 18px; font-weight: 700">12 oct. – 8 nov. 2026</h2>
      <div style="margin-left: auto; display: flex; align-items: center; gap: 14px; flex-wrap: wrap">
        <span style="display: flex; align-items: center; gap: 12px; font-size: 12px; font-weight: 600; color: #575757">
          <span style="display: flex; align-items: center; gap: 5px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #289DC9"></span>Basse</span>
          <span style="display: flex; align-items: center; gap: 5px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #FF9100"></span>Moyenne</span>
          <span style="display: flex; align-items: center; gap: 5px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #FF489C"></span>Haute</span>
        </span>
        <div role="tablist" aria-label="Échelle" style="display: flex; background: #F1F2F4; border-radius: 100px; padding: 3px">
          <sc-for list="{{ scales }}" as="t" hint-placeholder-count="3">
            <button type="button" role="tab" aria-selected="{{ t.selected }}" onClick="{{ t.pick }}" style="{{ t.style }}">{{ t.label }}</button>
          </sc-for>
        </div>
      </div>
    </div>

    <div style="flex: 1; overflow: auto; margin: 0 28px 28px; border: 1px solid #ECEDEF; border-radius: 20px">
      <div style="position: relative; width: 1212px">
        <!-- Header -->
        <div style="display: flex; position: sticky; top: 0; z-index: 3; background: #FFFFFF; border-bottom: 1px solid #ECEDEF">
          <div style="flex: 0 0 260px; position: sticky; left: 0; z-index: 4; background: #FFFFFF; border-right: 1px solid #ECEDEF; padding: 0 16px; display: flex; align-items: flex-end; padding-bottom: 10px; font-size: 12px; font-weight: 700; color: #575757; letter-spacing: 0.03em">TÂCHE</div>
          <div style="display: flex; flex-direction: column">
            <div style="display: flex; height: 26px; align-items: center; font-size: 12px; font-weight: 700; color: #343434">
              <span style="width: 646px; padding-left: 8px; box-sizing: border-box; border-right: 1px solid #ECEDEF">Octobre</span>
              <span style="width: 306px; padding-left: 8px; box-sizing: border-box">Novembre</span>
            </div>
            <div style="display: flex">
              <sc-for list="{{ days }}" as="d" hint-placeholder-count="28">
                <span style="{{ d.style }}"><span style="font-size: 10px; font-weight: 600">{{ d.wd }}</span><span style="{{ d.numStyle }}">{{ d.n }}</span></span>
              </sc-for>
            </div>
          </div>
        </div>

        <!-- Body -->
        <div style="position: relative">
          <div aria-hidden="true" style="position: absolute; top: 0; bottom: 0; left: 260px; width: 952px; z-index: 0">
            <sc-for list="{{ weekends }}" as="we" hint-placeholder-count="8">
              <div style="{{ we.style }}"></div>
            </sc-for>
            <div style="{{ todayStyle }}"></div>
          </div>
          <sc-for list="{{ rows }}" as="r" hint-placeholder-count="7">
            <sc-if value="{{ r.isSection }}" hint-placeholder-val="{{ false }}">
              <div style="display: flex; height: 38px; position: relative; z-index: 1; border-bottom: 1px solid #ECEDEF">
                <div style="flex: 0 0 260px; position: sticky; left: 0; z-index: 2; background: #FAFBFC; border-right: 1px solid #ECEDEF; padding: 0 16px; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700">{{ r.label }}<span style="font-size: 12px; color: #575757; font-weight: 600">{{ r.count }}</span></div>
                <div style="flex: 1; background: #FAFBFCcc"></div>
              </div>
            </sc-if>
            <sc-if value="{{ r.isTask }}" hint-placeholder-val="{{ true }}">
              <div style="display: flex; height: 46px; position: relative; z-index: 1; border-bottom: 1px solid #F1F2F4">
                <div style="flex: 0 0 260px; position: sticky; left: 0; z-index: 2; background: #FFFFFF; border-right: 1px solid #ECEDEF; padding: 0 16px 0 26px; display: flex; align-items: center; gap: 10px; min-width: 0">
                  <span style="{{ r.checkStyle }}"><svg aria-hidden="true" width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg></span>
                  <a href="Tache.dc.html" style="{{ r.nameStyle }}">{{ r.label }}</a>
                </div>
                <div style="position: relative; width: 952px">
                  <sc-if value="{{ r.hasOverdue }}" hint-placeholder-val="{{ false }}">
                    <div style="{{ r.overdueStyle }}"></div>
                  </sc-if>
                  <a href="Tache.dc.html" class="bar" style="{{ r.barStyle }}"><span style="width: 20px; height: 20px; border-radius: 100px; background: #FFFFFFcc; color: #214258; font-size: 9px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex: none">KB</span><span style="overflow: hidden; text-overflow: ellipsis">{{ r.barLabel }}</span></a>
                </div>
              </div>
            </sc-if>
          </sc-for>
          <div style="display: flex; height: 46px; position: relative; z-index: 1">
            <div style="flex: 0 0 260px; position: sticky; left: 0; z-index: 2; background: #FFFFFF; border-right: 1px solid #ECEDEF; padding-left: 16px; display: flex; align-items: center">
              <button type="button" class="hov" style="height: 34px; padding: 0 10px; border: none; background: none; border-radius: 10px; font-size: 14px; font-weight: 600; color: #575757; cursor: pointer">+ Ajouter une tâche</button>
            </div>
          </div>
          <div style="height: 220px"></div>
        </div>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { scale: 'jours' };
  }
  renderVals() {
    const W = 34, TODAY = 18;
    const wds = ['L', 'M', 'M', 'J', 'V', 'S', 'D'];
    const days = [];
    const weekends = [];
    for (let i = 0; i < 28; i++) {
      const n = i < 20 ? 12 + i : i - 19;
      const we = i % 7 >= 5;
      const today = i === TODAY;
      if (we) weekends.push({ style: 'position: absolute; top: 0; bottom: 0; left: ' + i * W + 'px; width: ' + W + 'px; background: #F6F7F9' });
      days.push({
        wd: wds[i % 7], n,
        style: 'width: ' + W + 'px; height: 40px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; color: ' + (we ? '#8A8B8E' : '#575757') + '; background: ' + (we ? '#F6F7F9' : '#FFFFFF'),
        numStyle: 'font-size: 12px; font-weight: 700; width: 22px; height: 22px; border-radius: 100px; display: flex; align-items: center; justify-content: center; ' + (today ? 'background: #D10553; color: #FFFFFF' : 'color: #343434')
      });
    }
    const colors = {
      basse: ['#D6F0F7', '#214258', '#289DC9'],
      moyenne: ['#FFF1DE', '#8A4B00', '#FF9100'],
      haute: ['#FEE5F2', '#D10553', '#FF489C'],
      done: ['#ECEDEF', '#575757', '#44AF01']
    };
    const task = (label, s, e, kind, opts = {}) => {
      const c = colors[kind];
      return {
        isTask: true, isSection: false, label,
        barLabel: opts.barLabel || label,
        checkStyle: 'flex: none; width: 18px; height: 18px; border-radius: 100px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; ' + (opts.done ? 'background: #44AF01; color: #FFFFFF' : 'border: 1.5px solid #8A8B8E; color: transparent'),
        nameStyle: 'font-size: 14px; font-weight: 600; text-decoration: ' + (opts.done ? 'line-through' : 'none') + '; color: ' + (opts.done ? '#575757' : '#121212') + '; white-space: nowrap; overflow: hidden; text-overflow: ellipsis',
        barStyle: 'position: absolute; top: 8px; height: 30px; left: ' + (s * W + 3) + 'px; width: ' + ((e - s + 1) * W - 6) + 'px; box-sizing: border-box; border-radius: 100px; background: ' + c[0] + '; border: 2px solid ' + c[2] + '; color: ' + c[1] + '; display: flex; align-items: center; gap: 6px; padding: 0 10px 0 3px; font-size: 12px; font-weight: 700; text-decoration: none; white-space: nowrap; overflow: hidden',
        hasOverdue: !!opts.overdueTo,
        overdueStyle: opts.overdueTo ? 'position: absolute; top: 14px; height: 18px; left: ' + ((e + 1) * W - 3) + 'px; width: ' + ((opts.overdueTo - e) * W) + 'px; border-radius: 0 100px 100px 0; background: repeating-linear-gradient(135deg, #FEE5F2 0 6px, #FFFFFF 6px 10px); border: 2px dashed #D10553; border-left: none; box-sizing: border-box' : ''
      };
    };
    const section = (label, count) => ({ isSection: true, isTask: false, label, count });
    const rows = [
      section('À faire', 1),
      task('Orientation Poster/Cadre', 18, 23, 'moyenne'),
      section('En cours', 2),
      task('Encart Imprim’Vert', 8, 17, 'basse', { overdueTo: TODAY, barLabel: 'Encart Imprim’Vert · 1/3' }),
      task('Design Paiement extra', 15, 21, 'haute'),
      section('Terminé', 1),
      task('Upgrade PHP', 1, 3, 'done', { done: true })
    ];
    const s = this.state;
    const scales = [['jours', 'Jours'], ['semaines', 'Semaines'], ['mois', 'Mois']].map(([id, label]) => ({
      label,
      selected: s.scale === id ? 'true' : 'false',
      style: 'height: 30px; padding: 0 14px; border: none; border-radius: 100px; font-size: 13px; font-weight: 700; cursor: pointer; ' + (s.scale === id ? 'background: #FFFFFF; color: #121212; box-shadow: 0 2px 4px 0 #112a3b1a' : 'background: transparent; color: #575757'),
      pick: () => this.setState({ scale: id })
    }));
    return {
      days, weekends, rows, scales,
      todayStyle: 'position: absolute; top: 0; bottom: 0; left: ' + (TODAY * W + W / 2 - 1) + 'px; width: 2px; background: #D10553; z-index: 2'
    };
  }
}
</script>
</body>
</html>
