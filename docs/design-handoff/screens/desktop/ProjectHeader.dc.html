<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>En-tête de projet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<header style="padding: 18px 28px 0; border-bottom: 1px solid #ECEDEF; background: #FFFFFF; font-family: 'Quicksand', sans-serif; color: #121212">
  <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap">
    <span style="width: 22px; height: 22px; border-radius: 6px; background: #44AF01"></span>
    <h1 style="margin: 0; font-size: 24px; font-weight: 700; line-height: 1.3">Test projet</h1>
    <span style="font-size: 12px; color: #575757; background: #F1F2F4; padding: 3px 10px; border-radius: 100px">dès le 28 oct.</span>
    <div style="margin-left: auto; display: flex; align-items: center; gap: 10px">
      <div style="width: 32px; height: 32px; border-radius: 100px; background: #D6F0F7; color: #214258; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">KB</div>
      <button type="button" style="height: 36px; padding: 0 18px; border-radius: 100px; border: 2px solid #FF489C; background: #FFFFFF; color: #D10553; font-family: inherit; font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 5px; cursor: pointer"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Ajouter une tâche</button>
    </div>
  </div>
  <nav aria-label="Vues du projet" style="display: flex; gap: 4px; margin-top: 14px; overflow-x: auto">
    <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="7">
      <a href="{{ t.href }}" aria-current="{{ t.current }}" style="{{ t.style }}">{{ t.label }}</a>
    </sc-for>
  </nav>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["kanban","liste","calendrier","planning","regles","collaborateurs","parametres"],"default":"kanban"},"$preview":{"width":1200,"height":120}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'kanban';
    const defs = [
      ['kanban', 'Kanban', 'Main.dc.html'],
      ['liste', 'Liste', 'Liste.dc.html'],
      ['calendrier', 'Calendrier', 'Calendrier.dc.html'],
      ['planning', 'Planning', 'Planning.dc.html'],
      ['regles', 'Règles', 'Regles.dc.html'],
      ['collaborateurs', 'Collaborateurs', 'Collaborateurs.dc.html'],
      ['parametres', 'Paramètres', 'Parametres.dc.html']
    ];
    const tabs = defs.map(([id, label, href]) => ({
      label, href,
      current: id === active ? 'page' : 'false',
      style: 'text-decoration: none; white-space: nowrap; padding: 10px 14px; font-size: 14px; ' + (id === active ? 'font-weight: 700; color: #121212; border-bottom: 2px solid #FF489C' : 'font-weight: 600; color: #575757; border-bottom: 2px solid transparent')
    }));
    return { tabs };
  }
}
</script>
</body>
</html>
