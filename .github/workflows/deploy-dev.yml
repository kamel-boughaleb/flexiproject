name: deploy-dev

on:
  workflow_run:
    workflows:
      - tests
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          DEV_SSH_KEY: ${{ secrets.DEV_SSH_KEY }}
          DEV_SSH_KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEV_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEV_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # The server pins this key to a forced command in ~/.ssh/authorized_keys:
      #   restrict,command="/home/kboughaleb/flexiproject/docker/deploy.sh" <DEV_SSH_KEY public key>
      # so this ssh runs docker/deploy.sh whatever command is sent, and nothing else.
      - name: Deploy (runs docker/deploy.sh on the server)
        env:
          DEV_SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          DEV_SSH_USER: ${{ secrets.DEV_SSH_USER }}
        run: ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$DEV_SSH_USER@$DEV_SSH_HOST"
